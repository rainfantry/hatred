# Pushing a tag like nsw-v2.29.0 builds the FOSS debug APK and publishes it as a GitHub pre-release.
name: Release APK

on:
  push:
    tags: ['nsw-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Debug APK
      run: chmod +x gradlew && ./gradlew assembleFossDebug

    - name: Rename APK
      run: |
        set -e
        src=$(ls app/build/outputs/apk/foss/debug/*.apk | head -1)
        cp "$src" "ARGUS-NSW-${GITHUB_REF_NAME#nsw-}-foss-debug.apk"
        sha256sum ARGUS-NSW-*.apk > SHA256SUMS.txt

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        name: ARGUS NSW ${{ github.ref_name }}
        prerelease: true
        generate_release_notes: true
        files: |
          ARGUS-NSW-*.apk
          SHA256SUMS.txt
